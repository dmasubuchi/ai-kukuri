name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit tests
        working-directory: tests
        env:
          PYTHONUTF8: "1"      # the tests themselves read and write UTF-8 text; the CLIs do not depend on this
        run: python -B -m unittest discover -p "test_*.py" -v
      - name: demo
        run: python -B examples/demo.py
      - name: npm launcher
        run: node bin/ai-kukuri.js doctor
      - name: npm pack, install and run
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/ai-kukuri-*.tgz
          npx --no-install ai-kukuri init "$RUNNER_TEMP/ws-npm"
          test -f "$RUNNER_TEMP/ws-npm/bin/kukuri-journal"
      - name: PowerShell installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 "$env:RUNNER_TEMP\ws-ps"
          if (-not (Test-Path "$env:RUNNER_TEMP\ws-ps\bin\kukuri-journal")) { throw 'workspace was not created' }
          python -B "$env:RUNNER_TEMP\ws-ps\bin\kukuri-journal" add --kind result --text "installed" --source "ci" --author ci
          ./install.ps1 -Repair "$env:RUNNER_TEMP\ws-ps"

