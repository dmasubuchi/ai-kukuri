name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit tests
        working-directory: tests
        run: python -B -m unittest discover -p "test_*.py" -v
      - name: demo
        run: python -B examples/demo.py
      - name: npm launcher
        run: node bin/kukuri-kit.js doctor
